<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=/examples/" />
    <title>正在打开 OmniCore Hub</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0d1117;
        color: #eef4fb;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        display: grid;
        gap: 12px;
        width: min(420px, calc(100vw - 32px));
        padding: 18px;
        border: 1px solid #263241;
        border-radius: 8px;
        background: #111822;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #9dadbd;
        font-size: 13px;
        line-height: 1.6;
      }

      a {
        width: max-content;
        max-width: 100%;
        padding: 8px 10px;
        border: 1px solid #48c7e8;
        border-radius: 8px;
        color: #d9f8ff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main data-root-launcher-redirect>
      <h1>正在打开 OmniCore Hub</h1>
      <p>如果浏览器没有自动跳转，请手动进入中文启动器。</p>
      <a href="/examples/">打开 OmniCore Hub</a>
    </main>
    <script>
      window.location.replace('/examples/');
    </script>
  </body>
</html>
