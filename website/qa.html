<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniCore Q&A</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    details { border: 1px solid rgba(148, 163, 184, 0.36); padding: 12px 14px; margin: 10px 0; background: rgba(15, 23, 42, 0.72); }
    summary { cursor: pointer; font-weight: 700; }
    p { color: #cbd5e1; line-height: 1.7; }
    code { color: #93c5fd; }
  </style>
</head>
<body>
  <main data-omnicore-qa>
    <h1>OmniCore 常见问题</h1>
    <details>
      <summary>如何加载资源？</summary>
      <p>使用 <code>game.loader.loadBundle()</code>，传入 key、url 和 type。图片路径写错时，Loader 会输出友好的缺失资源提示。</p>
    </details>
    <details>
      <summary>如何调试？</summary>
      <p>启动 <code>debug: true</code> 或 <code>editor: true</code>。你可以在场景树中选择实体，在属性面板中实时修改 x、y、scale。</p>
    </details>
    <details>
      <summary>如何把角色放进地图？</summary>
      <p>先创建 <code>Scene</code>，再用 <code>scene.add(new OmniCore.Sprite(...))</code> 添加角色。地图 JSON 加载后，把角色坐标设置到出生点。</p>
    </details>
  </main>
</body>
</html>
