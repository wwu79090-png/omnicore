<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniCore 在线 IDE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: #e2e8f0;
        background: #0f172a;
        font: 14px system-ui, sans-serif;
      }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid #1e293b;
        background: #020617;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 0.9fr) minmax(360px, 1.1fr);
        min-height: calc(100vh - 60px);
      }
      textarea {
        width: 100%;
        height: 100%;
        min-height: 520px;
        padding: 16px;
        color: #dbeafe;
        background: #020617;
        border: 0;
        border-right: 1px solid #1e293b;
        font: 13px/1.5 Consolas, monospace;
        resize: none;
        outline: none;
      }
      iframe {
        width: 100%;
        height: 100%;
        min-height: 520px;
        border: 0;
        background: #fff;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      button {
        padding: 7px 10px;
        color: #e2e8f0;
        background: #0f172a;
        border: 1px solid #38bdf8;
        cursor: pointer;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
        textarea,
        iframe {
          min-height: 360px;
          border-right: 0;
          border-bottom: 1px solid #1e293b;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <strong>OmniCore 在线 IDE</strong>
      <span>修改代码后实时预览</span>
      <button type="button" id="run">运行</button>
    </header>
    <main>
      <textarea id="code" spellcheck="false"></textarea>
      <iframe id="preview" title="实时预览"></iframe>
    </main>
    <script type="module">
      const starter = `const canvas = document.createElement('canvas');
canvas.width = 480;
canvas.height = 270;
document.body.style.margin = '0';
document.body.style.background = '#020617';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#38bdf8';
ctx.fillRect(80, 80, 96, 64);
ctx.fillStyle = '#e2e8f0';
ctx.font = '18px system-ui';
ctx.fillText('Hello OmniCore', 80, 168);`;
      const code = document.querySelector('#code');
      const preview = document.querySelector('#preview');
      const runButton = document.querySelector('#run');
      let timer = 0;
      code.value = starter;

      function run() {
        const html = `<!doctype html><html><body><script type="module">${code.value.replace(/<\/script>/g, '<\\/script>')}<\/script></body></html>`;
        preview.srcdoc = html;
      }

      code.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(run, 250);
      });
      runButton.addEventListener('click', run);
      run();
    </script>
  </body>
</html>
