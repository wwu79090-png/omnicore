<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniCore 30s Promo Recorder</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #f8fafc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    canvas {
      width: min(100%, 960px);
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: #0f172a;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button, a {
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 6px;
      padding: 10px 14px;
      background: #111827;
      color: #f8fafc;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }

    button:hover, a:hover {
      background: #1f2937;
    }
  </style>
</head>
<body>
  <canvas id="promo" width="1280" height="720"></canvas>
  <div class="controls">
    <button id="play" type="button">Play 30s Preview + BGM</button>
    <button id="record" type="button">Render 30s WebM</button>
    <a href="../index.html">Back to Homepage</a>
  </div>
  <script type="module">
    const canvas = document.querySelector('#promo');
    const ctx = canvas.getContext('2d');
    const perfGif = new Image();
    perfGif.src = '../../assets/branding/perf-demo.gif';
    const durationMs = 30000;
    let startedAt = performance.now();
    let audioContext = null;
    let masterGain = null;

    const frames = [
      { start: 0, end: 3000, label: 'git clone + npm install', sub: '33KB 级 Lean Core Web 游戏引擎' },
      { start: 3000, end: 8000, label: '3 lines to first sprite', sub: '三行代码画出第一个角色' },
      { start: 8000, end: 15000, label: '1000 Sprites / 144 FPS', sub: '高帧率演示' },
      { start: 15000, end: 22000, label: 'Online Playground + Editor', sub: '浏览器里直接试' },
      { start: 22000, end: 27000, label: 'Student-built, AI-assisted', sub: 'AI 加速测试、文档和重复工程活' },
      { start: 27000, end: 30000, label: 'Star OmniCore on GitHub', sub: '做 Web 小游戏，来试试' }
    ];

    function activeFrame(elapsed) {
      return frames.find((frame) => elapsed >= frame.start && elapsed < frame.end) || frames[frames.length - 1];
    }

    function drawTerminal(x, y, elapsed) {
      const lines = [
        '$ git clone github.com/wwu79090-png/omnicore',
        '$ npm install',
        '$ npm run dev',
        'OmniCore ready at http://localhost:5173',
        '800+ checks passed | lean core 33KB'
      ];
      ctx.fillStyle = '#020617';
      roundRect(x, y, 510, 220, 12);
      ctx.fill();
      ctx.font = '24px Consolas, monospace';
      lines.forEach((line, index) => {
        if (elapsed < index * 850) return;
        ctx.fillStyle = index === 0 ? '#38bdf8' : '#dbeafe';
        ctx.fillText(line, x + 28, y + 52 + index * 42);
      });
    }

    function drawCode(x, y, elapsed) {
      const lines = [
        "const game = await new OmniCore.Game({ parent: '#app' }).init();",
        "const scene = Object.assign(new OmniCore.Scene('play'), { create() {",
        "  this.add(new OmniCore.Sprite('hero', { x: 120, y: 120 }));",
        "} });",
        "game.scene.register(scene); await game.scene.push('play');"
      ];
      ctx.fillStyle = '#111827';
      roundRect(x, y, 700, 270, 12);
      ctx.fill();
      ctx.font = '21px Consolas, monospace';
      lines.forEach((line, index) => {
        if (elapsed < 3000 + index * 700) return;
        ctx.fillStyle = line.includes('Sprite') ? '#fbbf24' : '#e5e7eb';
        ctx.fillText(line, x + 24, y + 48 + index * 40);
      });
    }

    function drawGif(x, y, w, h) {
      ctx.fillStyle = '#020617';
      roundRect(x, y, w, h, 12);
      ctx.fill();
      if (perfGif.complete && perfGif.naturalWidth) {
        ctx.drawImage(perfGif, x + 12, y + 12, w - 24, h - 24);
      } else {
        ctx.fillStyle = '#38bdf8';
        ctx.font = '34px sans-serif';
        ctx.fillText('144 FPS demo loading...', x + 48, y + h / 2);
      }
    }

    function drawHero(elapsed) {
      const t = (elapsed % 2500) / 2500;
      const x = 780 + Math.sin(t * Math.PI * 2) * 90;
      const y = 330 + Math.cos(t * Math.PI * 2) * 40;
      ctx.fillStyle = '#38bdf8';
      roundRect(x, y, 70, 70, 8);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.font = '18px sans-serif';
      ctx.fillText('hero', x + 15, y + 42);
    }

    function render(time = performance.now()) {
      const elapsed = (time - startedAt) % durationMs;
      const frame = activeFrame(elapsed);
      const progress = elapsed / durationMs;

      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#020617');
      gradient.addColorStop(0.5, '#111827');
      gradient.addColorStop(1, '#0f766e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 64px sans-serif';
      ctx.fillText('OmniCore', 64, 104);
      ctx.font = '28px sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText('学生项目 + AI 辅助 + 超轻量 Web 游戏引擎', 66, 148);

      if (elapsed < 8000) {
        drawTerminal(64, 210, elapsed);
        drawCode(64, 460, elapsed);
        drawHero(elapsed);
      } else if (elapsed < 15000) {
        drawGif(64, 185, 760, 430);
        drawHero(elapsed);
      } else {
        drawGif(690, 190, 510, 290);
        drawTerminal(64, 220, elapsed);
        drawCode(64, 465, elapsed);
      }

      ctx.fillStyle = '#f8fafc';
      ctx.font = '700 46px sans-serif';
      ctx.fillText(frame.label, 64, 650);
      ctx.font = '28px sans-serif';
      ctx.fillStyle = '#bae6fd';
      ctx.fillText(frame.sub, 64, 690);

      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(64, 704, 1152 * progress, 6);

      requestAnimationFrame(render);
    }

    function roundRect(x, y, w, h, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function startBgm(destination = null) {
      audioContext = audioContext || new AudioContext();
      masterGain = audioContext.createGain();
      masterGain.gain.value = 0.045;
      masterGain.connect(destination || audioContext.destination);
      const notes = [261.63, 329.63, 392.0, 523.25];
      const now = audioContext.currentTime;
      for (let i = 0; i < 120; i += 1) {
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = 'triangle';
        osc.frequency.value = notes[i % notes.length];
        gain.gain.setValueAtTime(0.0001, now + i * 0.25);
        gain.gain.exponentialRampToValueAtTime(0.18, now + i * 0.25 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.25 + 0.2);
        osc.connect(gain).connect(masterGain);
        osc.start(now + i * 0.25);
        osc.stop(now + i * 0.25 + 0.22);
      }
      return audioContext;
    }

    async function renderVideo() {
      startedAt = performance.now();
      const audio = new AudioContext();
      const audioDestination = audio.createMediaStreamDestination();
      audioContext = audio;
      startBgm(audioDestination);
      const stream = canvas.captureStream(30);
      for (const track of audioDestination.stream.getAudioTracks()) stream.addTrack(track);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' });
      const chunks = [];
      recorder.ondataavailable = (event) => {
        if (event.data?.size) chunks.push(event.data);
      };
      const done = new Promise((resolve) => {
        recorder.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
      });
      recorder.start();
      await new Promise((resolve) => setTimeout(resolve, durationMs));
      recorder.stop();
      const blob = await done;
      return blob;
    }

    document.querySelector('#play').addEventListener('click', () => {
      startedAt = performance.now();
      startBgm();
    });

    document.querySelector('#record').addEventListener('click', async () => {
      const blob = await renderVideo();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'omnicore-30s-demo.webm';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    });

    window.renderOmniCorePromoVideo = renderVideo;
    render();
  </script>
</body>
</html>
