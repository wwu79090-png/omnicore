<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniCore Market Showcase</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d1216;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        overflow: hidden;
      }

      #game {
        width: 100vw;
        height: 100vh;
      }

      .overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: grid;
        grid-template-columns: minmax(260px, 380px) 1fr minmax(220px, 320px);
        gap: 16px;
        padding: 18px;
        box-sizing: border-box;
        z-index: 2;
      }

      .panel {
        align-self: start;
        border: 1px solid rgba(148, 163, 184, 0.32);
        background: rgba(13, 18, 22, 0.78);
        backdrop-filter: blur(10px);
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.28);
      }

      .panel h1,
      .panel h2,
      .panel p {
        margin: 0;
      }

      .panel h1 {
        font-size: 22px;
        line-height: 1.2;
      }

      .panel h2 {
        font-size: 14px;
        color: #bae6fd;
        margin-bottom: 10px;
      }

      .lead {
        color: #cbd5e1;
        margin-top: 8px;
        font-size: 13px;
        line-height: 1.55;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 14px;
      }

      .metric {
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 6px;
        padding: 9px 8px;
        background: rgba(15, 23, 42, 0.7);
      }

      .metric strong {
        display: block;
        color: #67e8f9;
        font-size: 18px;
        line-height: 1.1;
      }

      .metric span {
        display: block;
        color: #94a3b8;
        font-size: 11px;
        margin-top: 4px;
      }

      .rail {
        justify-self: end;
        align-self: start;
      }

      .steps {
        display: grid;
        gap: 9px;
        color: #dbeafe;
        font-size: 13px;
        line-height: 1.45;
      }

      .step {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 8px;
        align-items: start;
      }

      .step b {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #14b8a6;
        color: #052e2b;
      }

      .toolbar {
        position: fixed;
        left: 18px;
        bottom: 18px;
        right: 18px;
        z-index: 3;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }

      .toolbar button,
      .toolbar a {
        border: 1px solid rgba(248, 250, 252, 0.28);
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.88);
        color: #f8fafc;
        min-height: 36px;
        padding: 0 14px;
        text-decoration: none;
        cursor: pointer;
      }

      .toolbar a {
        display: inline-flex;
        align-items: center;
      }

      .toolbar button[aria-pressed="true"] {
        background: #f59e0b;
        color: #111827;
        border-color: #fbbf24;
      }

      code {
        color: #a7f3d0;
      }

      @media (max-width: 820px) {
        .overlay {
          grid-template-columns: 1fr;
          align-content: start;
          overflow-y: auto;
          pointer-events: none;
        }

        .rail {
          justify-self: stretch;
        }

        .metrics {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .toolbar {
          justify-content: flex-start;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body data-market-showcase>
    <div id="game" aria-label="OmniCore market showcase canvas"></div>
    <main class="overlay" data-html-overlay>
      <section class="panel">
        <h1>OmniCore Web Game Engine</h1>
        <p class="lead">1000 Sprite 性能云、2.5D 分层城市、HTML/CSS 覆盖层和三行上手代码放在同一个可运行页面里。</p>
        <div class="metrics">
          <div class="metric"><strong id="fps">144</strong><span>FPS target</span></div>
          <div class="metric"><strong>1000</strong><span>sprites</span></div>
          <div class="metric"><strong>33KB</strong><span>lean core</span></div>
        </div>
      </section>
      <div></div>
      <aside class="panel rail">
        <h2>10 分钟体验路径</h2>
        <div class="steps">
          <div class="step"><b>1</b><span><code>npm install omnicore</code></span></div>
          <div class="step"><b>2</b><span>三行代码画出第一个角色。</span></div>
          <div class="step"><b>3</b><span>切换性能/故事模式，观察 Canvas 与 HTML UI 混合渲染。</span></div>
        </div>
      </aside>
    </main>
    <nav class="toolbar" aria-label="Demo controls">
      <button type="button" data-mode="performance" aria-pressed="true">性能云</button>
      <button type="button" data-mode="story" aria-pressed="false">2.5D 故事</button>
      <a href="../full-game-demo/">完整游戏 Demo</a>
      <a href="../../docs/ten-minute-quickstart.md">10 分钟教程</a>
    </nav>
    <script type="module" src="./main.js"></script>
  </body>
</html>
