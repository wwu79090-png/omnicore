<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OmniCore Performance Hot Paths Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f8fafc;
        color: #111827;
        font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .lead {
        margin: 0 0 22px;
        color: #4b5563;
      }

      #report {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        min-height: 122px;
        padding: 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
      }

      .metric strong {
        display: block;
        margin-bottom: 8px;
        font-size: 24px;
        line-height: 1.1;
      }

      .metric code {
        color: #0f766e;
      }

      @media (max-width: 760px) {
        #report {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Performance Hot Paths Demo</h1>
      <p class="lead">Render batching, runtime pools, dirty sync, and WebGPU descriptor evidence in one page.</p>
      <section id="report" aria-label="Performance evidence"></section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
