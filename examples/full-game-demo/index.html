<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OmniCore 30 Minute Full Game Demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #07111f;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .shell {
        width: min(100vw, 980px);
        padding: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        letter-spacing: 0;
      }
      #game {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #38bdf8;
        background: #020617;
        overflow: hidden;
      }
      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        color: #cbd5e1;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      button {
        min-width: 44px;
        min-height: 36px;
        border: 1px solid #38bdf8;
        border-radius: 6px;
        background: #0f172a;
        color: #f8fafc;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body data-full-game-demo>
    <main class="shell">
      <h1>OmniCore 30 分钟完整游戏 Demo</h1>
      <div id="game"></div>
      <div class="hud">
        <span id="status">Collect energy. Avoid glitches.</span>
        <div class="controls" aria-label="Touch controls">
          <button type="button" data-move="left">Left</button>
          <button type="button" data-move="right">Right</button>
          <button type="button" id="restart">Restart</button>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
