<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniCore 2D/2.5D Platformer Demo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        color: #e5e7eb;
        font-family: system-ui, sans-serif;
      }

      #game {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      canvas {
        width: min(960px, 100vw);
        aspect-ratio: 16 / 9;
        image-rendering: pixelated;
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <main id="game">
      <canvas id="stage" width="640" height="360"></canvas>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
