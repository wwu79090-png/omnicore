<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniCore Physics Debug Draw Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
        background: #101418;
        color: #e6edf3;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(480px, 1fr) 360px;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100vh;
        display: block;
        background: #151c22;
      }

      aside {
        border-left: 1px solid #2d3742;
        background: #0d1117;
        padding: 20px;
        overflow: auto;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .metric {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid #26313c;
      }

      pre {
        white-space: pre-wrap;
        font-size: 12px;
        color: #9fb3c8;
      }
    </style>
  </head>
  <body>
    <canvas id="debug"></canvas>
    <aside>
      <h1>Physics Debug Draw Demo</h1>
      <div id="metrics"></div>
      <pre id="snapshot"></pre>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
