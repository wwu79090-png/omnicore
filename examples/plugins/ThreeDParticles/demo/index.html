<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ThreeDParticles Demo</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #111827; color: #e5e7eb; }
      main { max-width: 760px; margin: 0 auto; padding: 28px 20px; }
      canvas { width: 100%; height: 320px; background: #0f172a; border: 1px solid #334155; }
      button { margin-top: 12px; padding: 8px 12px; color: #e5e7eb; background: #164e63; border: 1px solid #38bdf8; }
    </style>
  </head>
  <body>
    <main data-omnicore-plugin-demo="ThreeDParticles">
      <h1>ThreeDParticles</h1>
      <canvas id="preview" width="720" height="320"></canvas>
      <button id="burst" type="button">Burst</button>
    </main>
    <script type="module">
      import plugin from '../src/index.js';

      const canvas = document.querySelector('#preview');
      const ctx = canvas.getContext('2d');
      const scene = { add() {} };
      const particles = plugin.install({ scene });

      function burst() {
        particles.spawnBurst3D({ x: 360, y: 180, z: 4, count: 48, speed: 92 });
      }

      function frame() {
        particles.update(1 / 60);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const particle of particles.snapshot().particles) {
          ctx.globalAlpha = particle.alpha;
          ctx.fillStyle = particle.z > 4 ? '#7dd3fc' : '#22c55e';
          ctx.beginPath();
          ctx.arc(particle.x, particle.y - particle.z * 4, Math.max(2, particle.scale * 4), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      document.querySelector('#burst').addEventListener('click', burst);
      burst();
      frame();
    </script>
  </body>
</html>
