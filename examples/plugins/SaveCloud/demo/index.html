<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SaveCloud Demo</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #0f172a; color: #e5e7eb; }
      main { max-width: 680px; margin: 0 auto; padding: 28px 20px; }
      button { margin-right: 8px; padding: 8px 12px; color: #e5e7eb; background: #164e63; border: 1px solid #38bdf8; }
      pre { min-height: 120px; padding: 12px; background: #111827; border: 1px solid #334155; }
    </style>
  </head>
  <body>
    <main data-omnicore-plugin-demo="SaveCloud">
      <h1>SaveCloud</h1>
      <button id="save" type="button">Save</button>
      <button id="load" type="button">Load</button>
      <pre id="output"></pre>
    </main>
    <script type="module">
      import plugin from '../src/index.js';

      const cloud = plugin.install({ namespace: 'omnicore-demo' });
      const output = document.querySelector('#output');
      document.querySelector('#save').addEventListener('click', async () => {
        const payload = await cloud.save('slot-1', { level: 7, coins: 120, party: ['hero', 'mage'] });
        output.textContent = JSON.stringify(payload, null, 2);
      });
      document.querySelector('#load').addEventListener('click', async () => {
        output.textContent = JSON.stringify(await cloud.load('slot-1'), null, 2);
      });
    </script>
  </body>
</html>
