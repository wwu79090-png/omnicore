<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniCore Standard Plugin Demo</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
      main { padding: 24px; }
      code { color: #38bdf8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Standard Plugin Demo</h1>
      <p>移动鼠标即可看到插件悬浮面板。该页面独立引用 OmniCore 和插件源码，无需完整项目环境。</p>
      <p>注册方式：<code>OmniCore.addon('standard', standardPlugin)</code></p>
    </main>

    <script type="module">
      import OmniCore from '../../../../src/index.js';
      import standardPlugin from '../src/index.js';

      OmniCore.addon('standard', standardPlugin);
      const bus = new OmniCore.EventBus();
      const store = new OmniCore.Store({ standardPlugin: { enabled: false } });
      bus.on('plugin:ready', (payload) => {
        console.log('plugin ready', payload);
      });
      await OmniCore.useAddon('standard', { bus, store });
      setInterval(() => bus.emit('plugin:tick', { at: Date.now() }), 1000);
    </script>
  </body>
</html>
