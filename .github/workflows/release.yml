name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  branch-guard:
    if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: No release work for this branch
        run: echo "No release work for this branch"

  security-patch-version:
    if: >-
      ${{ github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'deps(security): auto-merge dependabot patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate security patch
        run: |
          npm test
          npm run build
          npm run docs:build

      - name: Create patch release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore(release): %s [skip ci]"
          git push origin HEAD:main --follow-tags

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build docs
        run: npm run docs:build

      - name: Update changelog for tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npx standard-version --skip.commit --skip.tag --release-as "$VERSION"

      - name: NPM publish dry run
        run: npm run publish:dry-run

      - name: Publish security and privacy audit
        run: npm run publish:audit

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OmniCore ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/**

      - name: Prepare API docs artifact
        shell: bash
        run: |
          mkdir -p public
          cp -r docs/api public/api
          cp -r docs/api-site public/api-site
          cp README.md public/index.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-docs:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
