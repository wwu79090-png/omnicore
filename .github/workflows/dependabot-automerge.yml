name: Dependabot Security Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  guarded-automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run npm audit
        shell: bash
        run: npm audit --json > npm-audit.json || true

      - name: Evaluate Dependabot auto-merge policy
        id: policy
        run: node scripts/dependabot-automerge.js --audit npm-audit.json --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

      - name: Rebuild before auto-merge
        if: steps.policy.outputs.eligible == 'true'
        run: |
          npm test
          npm run build

      - name: Enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh pr merge "${{ github.event.pull_request.html_url }}"
          --auto
          --squash
          --subject "deps(security): auto-merge dependabot patch"
          --body "npm audit high-severity non-breaking dependency update approved by CI."
